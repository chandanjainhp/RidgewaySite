<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Ridgeway Night Watch — Sign in</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  html,body{height:100%;margin:0;}
  body{
    display:grid;place-items:center;min-height:100vh;
    background:#05070a;
  }
  .panel{
    width:380px;background:transparent;
    padding:0 4px;
  }
  .sname{
    font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.18em;
    color:var(--fg-3);text-align:center;margin-bottom:32px;
  }
  .time{
    font-family:var(--font-mono);color:var(--fg-1);
    font-size:56px;font-weight:300;letter-spacing:-.02em;line-height:1;
    text-align:center;margin-bottom:24px;
  }
  .statusline{
    text-align:center;font-family:var(--font-sans);font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.14em;color:var(--sev-minor);
    margin-bottom:48px;
  }
  form{display:flex;flex-direction:column;gap:12px;}
  input{
    font-family:var(--font-sans);font-size:14px;background:transparent;
    border:0;border-bottom:1px solid var(--border-default);color:var(--fg-1);
    padding:10px 2px;outline:none;transition:border var(--dur-fast);
  }
  input::placeholder{color:var(--fg-4);text-transform:uppercase;letter-spacing:.14em;font-size:11px;}
  input:focus{border-bottom-color:var(--accent);}
  button{
    font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:.24em;
    text-transform:uppercase;padding:14px;background:transparent;color:var(--fg-1);
    border:1px solid var(--border-strong);border-radius:0;cursor:pointer;margin-top:20px;
    transition:all var(--dur-fast);
  }
  button:hover{border-color:var(--accent);color:var(--accent);}
</style>
</head><body>
<div class="panel">
  <div class="sname">Ridgeway Site</div>
  <div class="time num" id="t">04:17:32</div>
  <div class="statusline">Overnight activity detected — 5 incidents logged</div>
  <form onsubmit="event.preventDefault();location.href='../dashboard/index.html';">
    <input placeholder="Username" autofocus/>
    <input type="password" placeholder="Password"/>
    <button type="submit">Enter</button>
  </form>
</div>
<script>
  function tk(){const d=new Date(),p=n=>String(n).padStart(2,'0');document.getElementById('t').textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}
  tk();setInterval(tk,1000);
</script>
</body></html>
