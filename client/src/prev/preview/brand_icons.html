<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
html,body{margin:0;background:var(--bg-surface-1);}
.wrap{padding:20px 24px;width:700px;box-sizing:border-box;}
.label{font-family:var(--font-sans);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--fg-3);margin-bottom:14px;}
.row{display:grid;grid-template-columns:repeat(10, 1fr);gap:16px;align-items:center;color:var(--fg-2);}
.row i{width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.row i svg{width:20px;height:20px;stroke-width:1.5;}
.note{color:var(--fg-3);font-size:11px;line-height:1.5;margin-top:14px;}
</style></head><body><div class="wrap">
<div class="label">Iconography · Lucide 1.5 stroke</div>
<div class="row">
  <i data-lucide="shield"></i>
  <i data-lucide="activity"></i>
  <i data-lucide="map"></i>
  <i data-lucide="radio"></i>
  <i data-lucide="alert-triangle"></i>
  <i data-lucide="check"></i>
  <i data-lucide="x"></i>
  <i data-lucide="flag"></i>
  <i data-lucide="clock"></i>
  <i data-lucide="camera"></i>
  <i data-lucide="wind"></i>
  <i data-lucide="move"></i>
  <i data-lucide="file-text"></i>
  <i data-lucide="chevron-right"></i>
  <i data-lucide="play"></i>
  <i data-lucide="pause"></i>
  <i data-lucide="rewind"></i>
  <i data-lucide="zap"></i>
  <i data-lucide="lock"></i>
  <i data-lucide="eye"></i>
</div>
<div class="note">Monochrome · inherits currentColor · sizes 14 / 16 / 20 only. No emoji. No mixed stroke weights.</div>
<script>lucide.createIcons();</script>
</div></body></html>
