<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;background:var(--bg-surface-1);}
.wrap{padding:20px 24px;width:700px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;}
.label{font-family:var(--font-sans);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--fg-3);margin-bottom:2px;}
.field{display:flex;flex-direction:column;gap:6px;}
.lb{font-family:var(--font-sans);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--fg-3);}
input{font-family:var(--font-sans);font-size:13px;background:var(--bg-surface-2);border:1px solid var(--border-strong);color:var(--fg-1);padding:9px 12px;border-radius:2px;outline:none;transition:border var(--dur-fast);}
input:focus{border-color:var(--border-focus);}
.row{display:flex;gap:12px;}
.row > *{flex:1;}
</style></head><body><div class="wrap">
<div class="label">Inputs · focus ring is 1px cyan, no glow</div>
<div class="row">
  <div class="field"><span class="lb">USERNAME</span><input value="m.ortega"/></div>
  <div class="field"><span class="lb">PASSWORD</span><input type="password" value="••••••••"/></div>
</div>
<div class="field"><span class="lb">SEARCH INCIDENTS</span><input placeholder="north fence · motion · 04:17"/></div>
</div></body></html>
