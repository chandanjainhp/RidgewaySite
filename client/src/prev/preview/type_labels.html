<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;background:var(--bg-surface-1);}
.wrap{padding:20px 24px;width:700px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;}
.label{margin-bottom:4px;}
.lbl{font-family:var(--font-sans);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;}
.row{display:flex;gap:20px;align-items:center;}
.meta{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-left:auto;}
</style></head><body><div class="wrap">
<div class="label">Labels · uppercase + tracked, rank-1 or rank-3</div>
<div class="row"><span class="lbl" style="color:var(--fg-1);">AGENT ACTIVITY</span><span class="meta">600 · +0.12em · fg-1</span></div>
<div class="row"><span class="lbl" style="color:var(--fg-3);">OVERNIGHT · 5 INCIDENTS</span><span class="meta">600 · +0.12em · fg-3</span></div>
<div class="row"><span class="lbl" style="color:var(--sev-serious);">SERIOUS</span><span class="meta">600 · +0.12em · serious</span></div>
<div class="row"><span class="lbl" style="color:var(--sev-harmless);">HARMLESS</span><span class="meta">600 · +0.12em · harmless</span></div>
<div class="row"><span class="lbl" style="color:var(--accent);">ON THE CLOCK</span><span class="meta">600 · +0.12em · accent</span></div>
</div></body></html>
