<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;background:var(--bg-surface-1);}
.wrap{padding:20px 24px;width:700px;box-sizing:border-box;}
.label{margin-bottom:14px;}
.row{display:flex;gap:0;}
.sev{flex:1;height:110px;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--border-hairline);}
.sev:last-child{border-right:0;}
.pin{width:14px;height:14px;border-radius:50%;}
.pin-serious{background:var(--sev-serious);box-shadow:var(--glow-serious);}
.pin-minor{background:var(--sev-minor);box-shadow:var(--glow-minor);}
.pin-harmless{background:var(--sev-harmless);box-shadow:var(--glow-harmless);}
.pin-unknown{background:var(--sev-unknown);}
.nm{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;}
.hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);}
</style></head><body><div class="wrap">
<div class="label">Severity · the only saturated colors in the system</div>
<div class="row">
  <div class="sev" style="background:var(--sev-serious-bg);"><div class="pin pin-serious"></div><div><div class="nm" style="color:var(--sev-serious);">Serious</div><div class="hx">#FF3838</div></div></div>
  <div class="sev" style="background:var(--sev-minor-bg);"><div class="pin pin-minor"></div><div><div class="nm" style="color:var(--sev-minor);">Minor</div><div class="hx">#E89A2B</div></div></div>
  <div class="sev" style="background:var(--sev-harmless-bg);"><div class="pin pin-harmless"></div><div><div class="nm" style="color:var(--sev-harmless);">Harmless</div><div class="hx">#7D8A6A</div></div></div>
  <div class="sev" style="background:var(--sev-unknown-bg);"><div class="pin pin-unknown"></div><div><div class="nm" style="color:var(--fg-2);">Unknown</div><div class="hx">#6B7686</div></div></div>
</div>
</div></body></html>
