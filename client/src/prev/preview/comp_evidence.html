<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;background:var(--bg-surface-1);}
.wrap{padding:20px 24px;width:700px;box-sizing:border-box;}
.label{font-family:var(--font-sans);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--fg-3);margin-bottom:14px;}
.chain{position:relative;padding-left:28px;}
.chain::before{content:'';position:absolute;left:8px;top:10px;bottom:10px;width:1px;background:var(--border-default);}
.step{position:relative;padding:10px 0;}
.step::before{content:'';position:absolute;left:-24px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--bg-surface-1);border:1px solid var(--border-strong);}
.step .num{position:absolute;left:-24px;top:14px;width:14px;height:14px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:9px;color:var(--fg-2);}
.src{font-family:var(--font-sans);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);}
.find{color:var(--fg-1);font-size:13px;line-height:1.5;margin-top:2px;}
.t{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-left:8px;}
</style></head><body><div class="wrap">
<div class="label">Evidence chain · numbered, source-labelled, plain English</div>
<div class="chain">
  <div class="step"><div class="num">1</div>
    <div><span class="src">MOTION SENSOR</span><span class="t">03:38:12</span></div>
    <div class="find">Trigger at north fence, zone 3. Duration 14s.</div>
  </div>
  <div class="step"><div class="num">2</div>
    <div><span class="src">CAMERA 7</span><span class="t">03:38:14</span></div>
    <div class="find">Frame gap: camera offline 03:38–03:44. Reason: routine reboot.</div>
  </div>
  <div class="step"><div class="num">3</div>
    <div><span class="src">WEATHER LOG</span><span class="t">03:42:00</span></div>
    <div class="find">14 m/s wind gust, NW, coincident with trigger window.</div>
  </div>
</div>
</div></body></html>
