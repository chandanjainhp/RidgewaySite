<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;background:var(--bg-briefing);}
.wrap{padding:20px 32px;width:700px;box-sizing:border-box;}
.label{font-family:var(--font-sans);color:#6a6357;font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:12px;}
.doc h2{font-family:var(--font-serif);color:var(--bg-briefing-ink);font-size:20px;font-weight:600;margin:0 0 6px;letter-spacing:-.005em;}
.doc p{font-family:var(--font-serif);color:var(--bg-briefing-ink);font-size:14px;line-height:1.65;margin:0;}
</style></head><body><div class="wrap">
<div class="label">IBM Plex Serif · briefing document</div>
<div class="doc">
<h2>Overnight Summary — 22 Apr</h2>
<p>Five incidents were logged between 22:00 and 04:00. Four have been
classified and cleared; one (04 — North Fence) requires your review.
Weather: clear, light NW wind, no precipitation.</p>
</div>
</div></body></html>
