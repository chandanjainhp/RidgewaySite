<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;background:var(--bg-surface-1);}
.wrap{padding:20px 24px;width:700px;box-sizing:border-box;display:flex;gap:36px;align-items:center;}
.label{font-family:var(--font-sans);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--fg-3);}
.box{display:flex;flex-direction:column;gap:10px;}
.count{font-family:var(--font-mono);font-size:48px;font-weight:500;letter-spacing:-.02em;line-height:1;}
.c-norm{color:var(--accent);}
.c-amber{color:var(--sev-minor);text-shadow:0 0 20px rgba(232,154,43,.3);}
.c-red{color:var(--sev-serious);text-shadow:0 0 20px rgba(255,56,56,.4);animation:blink 1s infinite;}
@keyframes blink{0%,60%{opacity:1;}80%{opacity:.55;}}
.sub{font-family:var(--font-sans);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--fg-3);}
</style></head><body><div class="wrap">
<div class="box"><span class="count num c-norm">02:47:18</span><span class="sub">UNTIL 8:00 AM</span></div>
<div class="box"><span class="count num c-amber">00:23:04</span><span class="sub" style="color:var(--sev-minor);">&lt; 30 MIN</span></div>
<div class="box"><span class="count num c-red">00:07:42</span><span class="sub" style="color:var(--sev-serious);">&lt; 10 MIN</span></div>
</div></body></html>
