<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;background:var(--bg-surface-1);}
.wrap{padding:20px 24px;width:700px;box-sizing:border-box;}
.label{margin-bottom:14px;}
.row{display:flex;gap:16px;align-items:center;}
.sw{width:120px;padding:10px 12px;border-radius:2px;border:1px solid var(--border-hairline);}
.sw .bar{height:24px;margin-bottom:8px;}
.sw .n{font-size:11px;color:var(--fg-2);font-weight:500;}
.sw .h{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);}
.sample{flex:1;}
.sample .h1{color:var(--fg-1);font-size:16px;font-weight:500;margin-bottom:4px;}
.sample .h2{color:var(--fg-2);font-size:13px;margin-bottom:4px;}
.sample .h3{color:var(--fg-3);font-family:var(--font-mono);font-size:11px;margin-bottom:4px;}
.sample .h4{color:var(--fg-4);font-family:var(--font-mono);font-size:10px;}
</style></head><body><div class="wrap">
<div class="label">Foreground ranks · 4 tiers, rank-4 is texture</div>
<div class="row">
  <div class="sample">
    <div class="h1">Incident 04 — North Fence</div>
    <div class="h2">Motion detected. Cross-referenced with wind log.</div>
    <div class="h3">04:17 · ZONE 3 · #NW-0412</div>
    <div class="h4">····· ticks · scale · disabled ·····</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;">
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-1);">fg-1 · #E6ECF3</div>
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-2);">fg-2 · #AAB4C2</div>
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);">fg-3 · #6B7686</div>
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-4);">fg-4 · #434D5C</div>
  </div>
</div>
</div></body></html>
