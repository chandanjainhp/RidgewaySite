<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;background:var(--bg-surface-1);}
.wrap{padding:24px;width:700px;box-sizing:border-box;display:flex;gap:24px;align-items:center;}
.clock{font-family:var(--font-mono);font-size:44px;color:var(--accent);font-weight:500;letter-spacing:-.02em;line-height:1;text-shadow:0 0 18px rgba(184,212,232,.35);}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:p 1.6s infinite var(--ease-out);}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(184,212,232,.6);}100%{box-shadow:0 0 0 14px rgba(184,212,232,0);}}
.meta{flex:1;}
.hx{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);}
.nm{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:4px;}
.body{color:var(--fg-3);font-size:12px;line-height:1.5;}
</style></head><body><div class="wrap">
  <div class="clock num">04:17:32</div>
  <div class="pulse"></div>
  <div class="meta">
    <div class="nm">Accent · Radar blue</div>
    <div class="hx">#B8D4E8 · live clock, focus ring, scrubber, agent pulse</div>
    <div class="body" style="margin-top:6px;">The "on the clock" color. Used for live state only. Never decorative.</div>
  </div>
</div></body></html>
