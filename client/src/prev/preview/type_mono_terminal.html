<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;background:var(--bg-terminal);}
.wrap{padding:20px 24px;width:700px;box-sizing:border-box;font-family:var(--font-mono);font-size:12px;line-height:1.7;}
.label{font-family:var(--font-sans);color:var(--fg-3);font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:12px;}
.ts{color:var(--term-dim);}
.tool{color:var(--term-tool);}
.result{color:var(--term-result);}
.classify{color:var(--term-classify);font-weight:500;}
.uncert{color:var(--term-uncertain);}
.err{color:var(--term-error);}
.dim{color:var(--term-dim);}
</style></head><body><div class="wrap">
<div class="label">JetBrains Mono · terminal color coding</div>
<div><span class="ts">04:17:02</span>  <span class="tool">tool</span>   <span class="dim">→</span> query_weather_log(03:40–03:50)</div>
<div><span class="ts">04:17:03</span>  <span class="result">result</span> 14 m/s wind gust at 03:42, nw</div>
<div><span class="ts">04:17:04</span>  <span class="classify">CLASSIFY incident_04 → HARMLESS · 0.91</span></div>
<div><span class="ts">04:17:06</span>  <span class="uncert">uncert</span>  <span class="dim">?</span> camera 7 offline 03:38–03:44</div>
<div><span class="ts">04:17:09</span>  <span class="err">error</span>   drone_route: lost gps fix 03:51</div>
</div></body></html>
