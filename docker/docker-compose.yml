version: "3.9"

services:
  # MongoDB database
  mongodb:
    image: mongo:7.0
    container_name: ridgeway-mongodb-local
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: ridgeway
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_local:/data/db
      - mongodb_config_local:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ridgeway-network-local

  # Redis cache and job queue
  redis:
    image: redis:7-alpine
    container_name: ridgeway-redis-local
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass password123
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data
    healthcheck:
      test: redis-cli --raw incr ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ridgeway-network-local

volumes:
  mongodb_data_local:
    driver: local
  mongodb_config_local:
    driver: local
  redis_data_local:
    driver: local

networks:
  ridgeway-network-local:
    driver: bridge
