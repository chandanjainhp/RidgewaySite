<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;background:var(--bg-surface-1);}
.wrap{padding:20px 24px;width:700px;box-sizing:border-box;}
.label{margin-bottom:14px;}
.row{display:flex;gap:16px;align-items:center;}
.r{display:flex;flex-direction:column;align-items:center;gap:6px;}
.b{width:56px;height:56px;background:var(--bg-surface-3);border:1px solid var(--border-default);}
.n{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);}
.v{font-family:var(--font-mono);font-size:10px;color:var(--fg-2);}
.note{color:var(--fg-3);font-size:11px;line-height:1.5;margin-left:auto;max-width:220px;}
</style></head><body><div class="wrap">
<div class="label">Radii · restrained, no soft shapes</div>
<div class="row">
  <div class="r"><div class="b" style="border-radius:0;"></div><div class="n">none</div><div class="v">0</div></div>
  <div class="r"><div class="b" style="border-radius:2px;"></div><div class="n">xs</div><div class="v">2 · default</div></div>
  <div class="r"><div class="b" style="border-radius:4px;"></div><div class="n">sm</div><div class="v">4 · panels</div></div>
  <div class="r"><div class="b" style="border-radius:6px;"></div><div class="n">md</div><div class="v">6 · modals</div></div>
  <div class="r"><div class="b" style="border-radius:999px;width:90px;height:28px;"></div><div class="n">pill</div><div class="v">filters only</div></div>
  <div class="note">The UI is precise, not friendly-looking. Nothing uses 8px+.</div>
</div>
</div></body></html>
