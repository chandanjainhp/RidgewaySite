<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;background:var(--bg-surface-1);}
.wrap{padding:24px;width:700px;box-sizing:border-box;display:flex;align-items:center;gap:28px;}
.logo{width:56px;height:56px;color:var(--accent);}
.marks{display:flex;flex-direction:column;gap:6px;}
.wm{font-family:var(--font-sans);font-size:18px;font-weight:600;letter-spacing:.14em;color:var(--fg-1);text-transform:uppercase;}
.sub{font-family:var(--font-sans);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--fg-3);}
.variants{margin-left:auto;display:flex;gap:14px;align-items:center;}
.sw{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-default);}
.sw.dark{background:#07090c;color:var(--accent);}
.sw.mid{background:var(--bg-surface-2);color:var(--fg-1);}
.sw.light{background:#f4f1ea;color:#1a1814;border-color:#d8d2c3;}
</style></head><body><div class="wrap">
<svg class="logo" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 2 L28 6 V15 C28 22 22.5 27.5 16 30 C9.5 27.5 4 22 4 15 V6 Z"/><circle cx="16" cy="16" r="4.5"/><path d="M16 9.5 V13 M16 19 V22.5 M9.5 16 H13 M19 16 H22.5"/></svg>
<div class="marks">
  <div class="wm">Ridgeway Night Watch</div>
  <div class="sub">Shield · crosshair · accent cyan</div>
</div>
<div class="variants">
  <div class="sw dark"><svg width="20" height="20" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 2 L28 6 V15 C28 22 22.5 27.5 16 30 C9.5 27.5 4 22 4 15 V6 Z"/><circle cx="16" cy="16" r="4.5"/><path d="M16 9.5 V13 M16 19 V22.5 M9.5 16 H13 M19 16 H22.5"/></svg></div>
  <div class="sw mid"><svg width="20" height="20" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 2 L28 6 V15 C28 22 22.5 27.5 16 30 C9.5 27.5 4 22 4 15 V6 Z"/><circle cx="16" cy="16" r="4.5"/><path d="M16 9.5 V13 M16 19 V22.5 M9.5 16 H13 M19 16 H22.5"/></svg></div>
  <div class="sw light"><svg width="20" height="20" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 2 L28 6 V15 C28 22 22.5 27.5 16 30 C9.5 27.5 4 22 4 15 V6 Z"/><circle cx="16" cy="16" r="4.5"/><path d="M16 9.5 V13 M16 19 V22.5 M9.5 16 H13 M19 16 H22.5"/></svg></div>
</div>
</div></body></html>
