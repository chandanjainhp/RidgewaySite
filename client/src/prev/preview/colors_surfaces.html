<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;background:var(--bg-base);}
.wrap{padding:20px 24px;width:700px;box-sizing:border-box;}
.label{margin-bottom:14px;}
.row{display:flex;gap:0;}
.sw{flex:1;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;box-sizing:border-box;border-right:1px solid rgba(255,255,255,.04);}
.sw:last-child{border-right:0;}
.sw .n{font-family:var(--font-mono);font-size:10px;color:var(--fg-2);line-height:1.2;}
.sw .h{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);line-height:1.2;}
</style></head><body><div class="wrap">
<div class="label">Surface ranks · elevation by rank, not shadow</div>
<div class="row">
  <div class="sw" style="background:var(--bg-base);"><div class="n">base</div><div class="h">#07090C</div></div>
  <div class="sw" style="background:var(--bg-canvas);"><div class="n">canvas</div><div class="h">#0B0E13</div></div>
  <div class="sw" style="background:var(--bg-surface-1);"><div class="n">surface-1</div><div class="h">#11151C</div></div>
  <div class="sw" style="background:var(--bg-surface-2);"><div class="n">surface-2</div><div class="h">#161B24</div></div>
  <div class="sw" style="background:var(--bg-surface-3);"><div class="n">surface-3</div><div class="h">#1C222D</div></div>
  <div class="sw" style="background:var(--bg-terminal);"><div class="n">terminal</div><div class="h">#080A10</div></div>
</div>
</div></body></html>
