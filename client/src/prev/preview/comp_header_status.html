<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;background:var(--bg-surface-1);}
.wrap{padding:20px 24px;width:700px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;}
.label{font-family:var(--font-sans);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--fg-3);}
.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-surface-2);border:1px solid var(--border-default);border-radius:2px;}
.logo{width:20px;height:20px;color:var(--accent);}
.word{font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--fg-1);text-transform:uppercase;}
.stat{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(184,212,232,.6);animation:p 1.6s infinite;}
@keyframes p{0%,100%{opacity:.4;}50%{opacity:1;}}
.clock{font-family:var(--font-mono);color:var(--accent);font-size:12px;}
.dropcard{padding:12px 14px;background:var(--bg-surface-2);border:1px solid var(--border-default);border-radius:2px;display:flex;align-items:center;gap:10px;}
.pill{font-family:var(--font-sans);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;padding:3px 8px;border-radius:2px;background:var(--sev-harmless-bg);color:var(--sev-harmless);border:1px solid var(--sev-harmless-dim);}
.pill.draft{background:var(--sev-unknown-bg);color:var(--fg-2);border-color:var(--border-default);}
.title{font-size:13px;color:var(--fg-1);}
.mt{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--fg-3);}
</style></head><body><div class="wrap">
<div class="label">Header + status badges</div>
<div class="hdr">
  <svg class="logo" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 2 L28 6 V15 C28 22 22.5 27.5 16 30 C9.5 27.5 4 22 4 15 V6 Z"/><circle cx="16" cy="16" r="4.5"/><path d="M16 9.5 V13 M16 19 V22.5 M9.5 16 H13 M19 16 H22.5"/></svg>
  <span class="word">Ridgeway Night Watch</span>
  <span class="stat"><span class="pulse"></span>AGENT · LIVE</span>
  <span class="clock num">04:17:32</span>
</div>
<div class="dropcard"><span class="pill draft">DRAFT</span><span class="title">Briefing — 22 Apr</span><span class="mt">updated 04:16</span></div>
<div class="dropcard"><span class="pill">APPROVED</span><span class="title">Briefing — 21 Apr</span><span class="mt">approved 07:58</span></div>
</div></body></html>
