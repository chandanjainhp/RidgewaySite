<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;background:var(--bg-surface-1);}
.wrap{padding:20px 24px;width:700px;box-sizing:border-box;}
.label{margin-bottom:16px;}
.row{display:flex;gap:12px;align-items:flex-end;}
.sp{display:flex;flex-direction:column;align-items:center;gap:6px;}
.bar{background:var(--fg-3);height:8px;}
.n{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);}
.v{font-family:var(--font-mono);font-size:10px;color:var(--fg-2);}
</style></head><body><div class="wrap">
<div class="label">Spacing · 4-px base grid</div>
<div class="row">
  <div class="sp"><div class="bar" style="width:4px;"></div><div class="n">1</div><div class="v">4</div></div>
  <div class="sp"><div class="bar" style="width:8px;"></div><div class="n">2</div><div class="v">8</div></div>
  <div class="sp"><div class="bar" style="width:12px;"></div><div class="n">3</div><div class="v">12</div></div>
  <div class="sp"><div class="bar" style="width:16px;"></div><div class="n">4</div><div class="v">16</div></div>
  <div class="sp"><div class="bar" style="width:20px;"></div><div class="n">5</div><div class="v">20</div></div>
  <div class="sp"><div class="bar" style="width:24px;"></div><div class="n">6</div><div class="v">24</div></div>
  <div class="sp"><div class="bar" style="width:32px;"></div><div class="n">8</div><div class="v">32</div></div>
  <div class="sp"><div class="bar" style="width:40px;"></div><div class="n">10</div><div class="v">40</div></div>
  <div class="sp"><div class="bar" style="width:48px;"></div><div class="n">12</div><div class="v">48</div></div>
  <div class="sp"><div class="bar" style="width:64px;"></div><div class="n">16</div><div class="v">64</div></div>
</div>
</div></body></html>
